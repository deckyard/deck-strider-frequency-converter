[book]
title = "@skiffyard/strider"
description = "Reader for STRidER-style STR allele-frequency tables in XML"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "meridian"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
logo = "skiffyard.svg"
favicon = "skiffyard.svg"
repoUrl = "https://github.com/skiffyard/deck-strider-frequency-converter"
repoLabel = "Source"
editUrl = "https://github.com/skiffyard/deck-strider-frequency-converter/edit/main/docs/{path}"
footer = 'Part of <a href="https://github.com/skiffyard">Skiffyard</a>, small community decks for <a href="https://jennifer-lang.dev/">Jennifer</a>. Rendered with <a href="https://grimoire.jennifer-lang.dev/">Grimoire</a>.'

[highlight]
enabled = true

[search]
enabled = true
bodyChars = 1200
