[book]
title = "@mplx/strider"
description = "Reader for STRidER-style STR allele-frequency tables in XML"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "grimoire"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
repoUrl = "https://github.com/mplx/deck-strider-frequency-converter"
repoLabel = "Source"
editUrl = "https://github.com/mplx/deck-strider-frequency-converter/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true
bodyChars = 1200
